<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counters</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete,edit,home,refresh,sell" />
    <link rel="icon" href="favicon.png" type="image/x-icon">
</head>
<body>

    <header id="mainHeader">
        <button id="menuBtn" class="menu-btn" title="Ver etiquetas">☰</button>
        <h1 id="pageTitle">Mis Contadores</h1>
        <div class="header-actions">
            <button id="langBtn" class="lang-btn" title="Cambiar idioma">ES</button>
        </div>
    </header>

    <header id="selectionHeader" class="selection-header hidden">
        <div class="selection-left">
            <button id="cancelSelectionBtn" class="cancel-selection-btn" title="Cancelar selección">&times;</button>
            <span id="selectionCount">0</span>
        </div>
        <div class="selection-actions">
            <button id="editSelectionBtn" class="selection-btn" title="Editar"><span class="material-symbols-outlined">edit</span></button>
            <button id="resetSelectionBtn" class="selection-btn" title="Reiniciar a 0"><span class="material-symbols-outlined">refresh</span></button>
            <button id="deleteSelectionBtn" class="selection-btn delete" title="Eliminar"><span class="material-symbols-outlined">delete</span></button>
        </div>
    </header>

    <!-- Sidebar para etiquetas -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3><span class="material-symbols-outlined tag-header-icon">sell</span> <span id="sidebarTitle">Etiquetas</span></h3>
            <button id="closeSidebar" class="close-sidebar">&times;</button>
        </div>
        <nav id="tagsList" class="tags-list">
            <!-- Se cargará por JS -->
        </nav>
        <div class="sidebar-footer">
            <button id="editTagsBtn" class="edit-tags-footer-btn">
                <span class="material-symbols-outlined">edit</span> <span id="editTagsText">Editar etiquetas</span>
            </button>
            <button id="addTagBtn" class="add-tag-footer-btn">
                <span id="addTagIcon">+</span> <span id="addTagText">Añadir etiqueta</span>
            </button>
        </div>
    </aside>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Grid donde se pintarán los contadores -->
    <div class="counters-container" id="countersContainer"></div>

    <!-- Botón flotante -->
    <button id="fabAdd" class="fab-btn" title="Añadir nuevo contador">+</button>

    <!-- Modal para etiquetas -->
    <dialog id="tagDialog" class="counter-modal">
        <form method="dialog">
            <h2 id="modalTitleTag">Nueva Etiqueta</h2>
            <div class="modal-body">
                <input type="text" id="tagNameInput" placeholder="Ej. Salud, Deporte..." maxlength="20" required>
            </div>
            <div class="modal-actions">
                <button type="button" id="cancelTagBtn" class="btn-cancel">Cancelar</button>
                <button type="submit" id="confirmTagBtn" class="btn-confirm">Añadir</button>
            </div>
        </form>
    </dialog>

    <!-- Modal (Dialog) para crear nuevo contador -->
    <dialog id="counterDialog" class="counter-modal">
        <form method="dialog">
            <h2 id="modalTitle">Nuevo Contador</h2>
            <div class="modal-body">
                <input type="text" id="counterName" placeholder="Ej. Vasos de agua, Flexiones..." maxlength="30" required>
                
                <div class="form-row">
                    <div class="color-selection-group">
                        <label id="labelColor">Color:</label>
                        <div class="color-presets" id="colorPresets">
                            <button type="button" class="color-preset active" style="background-color: #3498db;" data-color="#3498db"></button>
                            <button type="button" class="color-preset" style="background-color: #e100ff;" data-color="#e100ff"></button>
                            <button type="button" class="color-preset" style="background-color: #e74c3c;" data-color="#e74c3c"></button>
                            <button type="button" class="color-preset" style="background-color: #2ecc71;" data-color="#2ecc71"></button>
                            <button type="button" class="color-preset" style="background-color: #f1c40f;" data-color="#f1c40f"></button>
                            <div class="color-custom-container">
                                <button type="button" id="customColorBtn" class="color-preset custom-btn" title="Color personalizado">
                                    <span class="material-symbols-outlined edit-icon">edit</span>
                                </button>
                                <input type="color" id="counterColor" value="#3498db" class="hidden-color-picker">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tags-selection-container">
                    <label><span class="material-symbols-outlined label-tag-icon">sell</span> <span id="labelTags">Etiquetas:</span></label>
                    <div id="modalTagsList" class="modal-tags-list">
                        <!-- Se cargarán dinámicamente -->
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" id="cancelBtn" class="btn-cancel">Cancelar</button>
                <button type="submit" id="addBtn" class="btn-confirm">Añadir</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
